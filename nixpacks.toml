[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "npm cache clean --force",
  "npm install --production=false"
]

[phases.build]
cmds = [
  "DATABASE_URL=postgresql://user:pass@localhost:5432/db npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma migrate deploy && npm start"
